apis:
- aid: agenthaven-dev:agent-bench-travel-merchant
  name: Agent Bench Travel Merchant
  description: >-
    Seller agent for flight search and travel checkout, exposed on one host through two protocol doors: A2A
    JSON-RPC 0.3 at https://travel.agenthaven.dev/a2a (message/send with a DataPart {action, input} or a
    one-line TextPart) and MCP 2025-06-18 at https://travel.agenthaven.dev/mcp (initialize, ping, tools/list,
    tools/call). Two operations, called in order: search_flights (anonymous; IATA codes and an ISO date in,
    up to two signed quotes valid ten minutes out — cheapest and fastest, with itinerary and EUR fare in minor
    units) and create_checkout (bearer JWT under a spending mandate; turns one quote into a Stripe test-mode
    payment intent and stops — no ticket, no real money). Every response carries a request id and an evidence
    block naming the merchant, the card digest and the SPIFFE signer; every call is written to the public
    hash-chained ledger at /ledger. No OpenAPI: the machine-readable contract is tools/list.
  humanURL: https://travel.agenthaven.dev/
  baseURL: https://travel.agenthaven.dev
  tags:
  - A2A
  - MCP
  - Travel
  - Flights
  - Agentic Commerce
  - agent-native
