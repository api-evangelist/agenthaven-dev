    /.well-known/* path returns the same JSON 404 ({"error":{"code":"not_found","message":"Route not found."}},
    111 bytes) — including both agent-card paths — and www.agenthaven.dev 301s everything to the apex. The card
    lives on the agent's own host, travel.agenthaven.dev, at the canonical path; the legacy
    /.well-known/agent.json on that host returns a byte-identical copy (2,905 bytes). dns-aid.agenthaven.dev is
    an alias of the same origin and serves the same card. A negative-control path
    (/.well-known/apievangelist-negative-control-7f3a9c.json) 404s on every host, so the 200 is a served
    document and not a catch-all. The card is additionally pinned OUT OF BAND: the SVCB record at
    travel.agenthaven.dev (DNSSEC-signed, ECDSAP256SHA256, DS at the parent) carries key65400 = the card URL,
    key65401 = its SHA-256 digest (sWJzLIPAuM_xhwpvjtKYy3xJ6VI75YPZo6gxYFJ2xr0) and key65405 = an ES256 JWS
    over the record; the digest we computed over the fetched bytes matches, and matches the hex form
    (b162732c…76bd) that GET /health reports as identity.agent_card_sha256.
  ownership: >-
    The card's provider.organization is "Agent Bench" with provider.url https://agenthaven.dev — the
    registrable domain this profile is keyed on — and its url, documentationUrl and both supportedInterfaces
    point at travel.agenthaven.dev in the same zone. The MCP server on that host identifies itself as
