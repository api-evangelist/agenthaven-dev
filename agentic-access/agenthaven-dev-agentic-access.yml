  was not run — there is no OpenAPI — and this file is NOT a heuristic classification: the provider publishes
  real agent-access guidance (who may call what, under whose authority, with what cap, for how long, audited
  where), and every field below cites the surface it was read from. Only the action-class / consequence labels
  are ours, applied from the Curity vocabulary to what the provider states. Reviewed per deployment; audience
  is left null.
