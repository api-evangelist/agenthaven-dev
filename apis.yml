aid: agenthaven-dev
name: Agent Bench
description: >-
  Agent Bench operates agenthaven.dev, a DNSSEC-signed zone that publishes AI agents through DNS-AID, and runs
  one live agent in it: the Agent Bench Travel Merchant at travel.agenthaven.dev — a proof-of-concept seller
  agent that quotes real flight fares (Google Flights via SerpApi) and turns a chosen quote into a Stripe
  test-mode payment intent under a buyer-supplied spending mandate. It is reachable over A2A (JSON-RPC 0.3,
  agent card at the canonical well-known path, pinned by SHA-256 digest and ES256 signature in the DNS SVCB
  record) and MCP (2025-06-18, two tools with full input and output schemas, anonymous tools/list). It
  publishes a SPIFFE JWT-SVID for the running instance, DANE TLSA pins, an ARD trust catalog, a GoDaddy ANS
  registration and a public hash-chained ledger of every quote, refusal and checkout. No OpenAPI, no SDKs, no
  pricing; no real money moves and no ticket is issued.
