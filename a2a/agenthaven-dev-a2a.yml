agent_card:
  name: Agent Bench Travel Merchant
  description: >-
    Seller agent for flight search and travel checkout. Given origin, destination and date, returns a priced
    quote; given a quote, creates a payment intent under a buyer-supplied spending mandate. Proof of concept:
    payment is simulated and no ticket is issued.
  url: https://travel.agenthaven.dev/a2a
  version: 0.1.0
  protocol_version: '0.3'
  preferred_transport: JSONRPC
  provider:
    organization: Agent Bench
    url: https://agenthaven.dev
  documentation_url: https://travel.agenthaven.dev/
  supported_interfaces:
  - {url: 'https://travel.agenthaven.dev/a2a', transport: JSONRPC, protocolBinding: JSONRPC, protocolVersion: '0.3'}
  - {url: 'https://travel.agenthaven.dev/mcp', transport: JSONRPC, protocolBinding: MCP, protocolVersion: '2025-06-18'}
  capabilities:
    streaming: false
  default_input_modes: [application/json]
  default_output_modes: [application/json]
  security_schemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      summary: >-
        Needed for create_checkout only; search_flights and tools/list are open. No public token endpoint. Two
        accepted forms — (1) a per-call request envelope (compact JWS, typ request+jwt) signed under a key
        attested at /.well-known/agent-keys.json on the CALLER's own domain, plus a checkout mandate from an
        authority the merchant trusts (https://sealedby.dev) bound to the quote and to that key; (2) a JWT
        issued by the merchant's operator on request (iss agent-bench-demo-issuer, aud agent-bench, scope
        commerce:purchase, EUR spending cap).
  skill_count: 2
  skills:
  - {id: flight-search, name: Flight search, tags: [flights, flight-search, travel, quote], security: none, mcp_tool: search_flights}
  - {id: travel-checkout, name: Travel checkout, tags: [travel, checkout, payment-intent], security: 'bearer [commerce:purchase]', mcp_tool: create_checkout}
  skill_invocation: >-
    Each skill description states its A2A invocation exactly: message/send with one DataPart
    {"action":"search_flights","input":{"origin":"MAD","destination":"LHR","departure_date":"YYYY-MM-DD"}} or
    {"action":"create_checkout","input":{"quote_id":"…","merchant_id":"…","currency":"…"}}, or a TextPart
    carrying the one-line command "search_flights MAD LHR YYYY-MM-DD" / "create_checkout <quote_id>". The
    machine-readable input schemas are not in the card; the card delegates them to tools/list on the MCP
    interface, which answers anonymously (see mcp/agenthaven-dev-mcp.yml).
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) — {streaming: false} — with
    pushNotifications and stateTransitionHistory left to their false defaults. protocolVersion is present at
    the top level (pass), declared as "0.3". skills is an ARRAY (pass) of two fully-described skills, each
    with id, name, description and tags, and the checkout skill carrying a per-skill security requirement.
    All three optional discriminators are present: preferredTransport JSONRPC, defaultInputModes and
    defaultOutputModes both application/json. The endpoint was confirmed live as a JSON-RPC 2.0 responder.
  deviations:
  - field: protocolVersion
    observed: '"0.3"'
    note: Two-component string. The A2A specification versions are written "0.3.0"; a strict semver comparison against "0.3.0" fails on the literal while the meaning is unambiguous.
  - field: supportedInterfaces[] alongside top-level url / preferredTransport
    observed: both shapes at once
    note: >-
      The card carries the 0.3-era top-level triple (url, preferredTransport, protocolVersion) AND a
      1.0-style supportedInterfaces[] block with protocolBinding — a mixed-generation card that reads under
      either revision. Recorded because both shapes coexist in the catalog, not as a fault.
  - field: supportedInterfaces[1].protocolBinding
    observed: '"MCP" with protocolVersion "2025-06-18"'
    note: >-
      Not an A2A transport binding (the spec enumerates JSONRPC, GRPC and HTTP+JSON). The card is using the
      interface list to advertise its Model Context Protocol endpoint on the same host, which an A2A client
      iterating supportedInterfaces will not know how to speak. Useful to a reader; outside the spec's
      vocabulary. The MCP server is real and open — see mcp/agenthaven-dev-mcp.yml.
  - field: skills[1].security
    observed: '[{"bearer":["commerce:purchase"]}] against an http-bearer scheme'
    note: >-
      Scope lists are defined for oauth2 and openIdConnect schemes; against an http scheme the string is a
      JWT scope claim by convention. The securitySchemes.bearer description explains it (scope
      commerce:purchase in an operator-issued JWT), so the intent is recoverable from the card.
  - field: signatures
    observed: absent from the card
    note: >-
      The card carries no in-card JWS signature block. Its integrity binding is external and stronger than most
      in the catalog: the SHA-256 digest and an ES256 signature over the discovery record live in a
      DNSSEC-signed SVCB record (DNS-AID), the ARD catalog repeats the digest, and /health reports it. An A2A
      reader that only looks inside the card will see an unsigned card.
  - field: JSON-RPC method surface
    observed: 'message/send only ("This agent answers message/send only.")'
    note: >-
      A2A 0.3 defines tasks/get as part of the core method set; this agent implements only message/send, and
      says so in the -32601 error data. Consistent with capabilities.streaming false and a two-step
      request/response design, but a client that follows up with tasks/get or tasks/cancel gets Method not
      supported.
  - field: provider.organization vs zone
    observed: '"Agent Bench" at agenthaven.dev'
    note: The company name and the domain differ; both are the provider's own and consistent across the card, the ARD catalog, the MCP serverInfo and the ANS registration. Recorded so the naming does not read as a mismatch.
surface_relationship:
  note: >-
    One agent, two protocol doors, no REST contract. The A2A actions search_flights and create_checkout ARE the
    two MCP tools of the same names: the card says the machine-readable schemas come from tools/list on the MCP
    interface, the A2A error data says the same, and the MCP initialize instructions repeat the card's
    authorization text verbatim. There is no OpenAPI, GraphQL or documented REST path for either operation
    (/openapi.json, /openapi.yaml, /swagger.json, /docs all 404 on the host), so no tool crosswalk is emitted.
    Three read-only JSON surfaces sit beside the agent — GET /health (status, mode, counters, guest policy),
    GET /ledger (a hash-chained, ES256-signed record of every quote, refusal, intent and completed checkout;
    639 entries 2026-08-27 → 2026-09-19 at fetch) and the /.well-known key documents — and are catalogued in
    well-known/, lifecycle/ and errors/.
